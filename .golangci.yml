run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow
  gosec:
    severity: medium
    confidence: medium
    excludes:
      - G402 # TLS InsecureSkipVerify is purposefully allowed for lab BIG-IPs in NewInsecureHTTPClient

issues:
  exclude-dirs:
    - dist
    - bin
