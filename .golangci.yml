run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
    - bodyclose

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow
  gosec:
    severity: medium
    confidence: medium

issues:
  exclude-dirs:
    - dist
    - bin
