run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert
    - bodyclose
    - errorlint
    - gofmt
    - noctx
    - revive
    - unparam
    - whitespace

linters-settings:
  govet:
    enable-all: true
    disable:
      - shadow
  gosec:
    severity: medium
    confidence: medium
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf

issues:
  exclude-dirs:
    - dist
    - bin
