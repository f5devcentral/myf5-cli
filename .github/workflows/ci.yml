name: "CI & Multi-Platform Quality Verification"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-vet:
    name: Lint, Vet & Code Standards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Verify Formatting (gofmt)
        run: |
          UNFORMATTED=$(gofmt -l .)
          if [ -n "$UNFORMATTED" ]; then
            echo "Error: Unformatted Go code detected in:"
            echo "$UNFORMATTED"
            echo "Run 'gofmt -s -w .' to fix."
            exit 1
          fi

      - name: Run go vet (Static Analysis)
        run: go vet ./...

  unit-test:
    name: Test on ${{ matrix.os }} (Go ${{ matrix.go-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go-version: ["1.26.x", "stable"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Unit Tests with Race Detector & Coverage
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            go test -v ./...
          else
            go test -v -race -covermode=atomic -coverprofile=coverage.out ./...
          fi

      - name: Upload Coverage Artifact (Ubuntu only)
        if: matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report
          path: coverage.out

  host-build:
    name: Build Verification on ${{ matrix.os }}
    needs: [lint-and-vet, unit-test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "stable"
          cache: true

      - name: Build Binary
        run: go build -v -o bin/myf5${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd/myf5

      - name: Smoke Test Version Output
        shell: bash
        run: |
          ./bin/myf5${{ runner.os == 'Windows' && '.exe' || '' }} version
