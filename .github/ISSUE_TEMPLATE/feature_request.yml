name: "Feature Request"
description: "Suggest an idea or enhancement for myf5-cli"
title: "[FEATURE]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for proposing an enhancement to `myf5-cli`. Please explain the enterprise use case and expected benefit.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Use Case
      description: Is your feature request related to a problem or workflow limitation?
      placeholder: "I am trying to automate BIG-IP upgrades on jump boxes, but..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution / CLI Interface
      description: Describe the solution or CLI flags/subcommands you would like to see.
      placeholder: "Add 'myf5 downloads verify <iso-file>' to..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.

  - type: textarea
    id: f5_context
    attributes:
      label: F5 Ecosystem Context
      description: Relevant TMOS versions, Cloud API endpoints, or automation frameworks (e.g. Ansible, Terraform).
